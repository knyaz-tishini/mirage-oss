[package]
license = "MIT"
name = "mirage-standalone"
version = "0.1.0"
publish = false
edition = "2021"
description = "Server half of Mirage for the standalone client: local state, config and the client.link artefact"
repository = "https://github.com/knyaz-tishini/mirage-oss"
homepage = "https://github.com/knyaz-tishini/mirage-oss"
[lib]
name = "mirage_standalone"
path = "src/lib.rs"

[[bin]]
name = "m1r4g3-server"
path = "src/bin/m1r4g3-server.rs"

[dependencies]
mirage-core = { path = "../mirage-core", version = "0.1.1"  }
mirage-control-plane = { path = "../mirage-dial-core", version = "0.1.1"  }
mirage-node = { path = "../../../mirage-node/crates/mirage-node"  }
mirage-perimeter = { path = "../mirage-perimeter", version = "0.1.1"  }
mirage-protocol = { path = "../mirage-protocol", features = ["ssh", "grpc"], version = "0.1.1"  }
mirage-subscriber-gate = { path = "../mirage-subscriber-gate", version = "0.1.1"  }
# The leg of a chain: the config, the credential, the protocol and the dial.
# The fleet's edge speaks the very same leg, and the two must not drift apart.
mirage-chain-leg = { path = "../mirage-chain-leg", version = "0.1.1"  }
arc-swap = "1"
async-trait = "0.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
# The node's own UDP endpoints hold a quinn endpoint — the socket behind a
# QUIC mask. The type is named here so the endpoint can be bound up front.
quinn = "0.11"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
# The box's own log. Without a subscriber installed, every `tracing::warn!`
# inside the node, the perimeter and the subscriber gate is dropped on the
# floor — the box would refuse a customer in silence, and the operator would
# have nothing to read but the banner.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The chain's credential names this box by a UUID. The crate is already in the
# tree — `mirage-core` carries it — so this is the same code, named directly.
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1.8", features = ["alloc"] }

# The end-to-end test walks the whole path a customer's bytes take, so it
# needs the client half of the wire: the mux session, the client handshake
# and the futures traits the mux transport speaks.
[dev-dependencies]
futures = "0.3"
mirage-mux = { path = "../mirage-mux", version = "0.1.1"  }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
