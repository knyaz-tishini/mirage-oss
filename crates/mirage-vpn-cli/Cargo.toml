[package]
name = "mirage-vpn-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Server and client programs around mirage-vpn: config, listeners, and connect."
repository = "https://github.com/knyaz-tishini/mirage-oss"
homepage = "https://github.com/knyaz-tishini/mirage-oss"
[lib]
name = "mirage_vpn_cli"
path = "src/lib.rs"

[[bin]]
name = "mirage-vpn"
path = "src/main.rs"

[dependencies]
mirage-vpn = { workspace = true  }
mirage-core = { workspace = true  }
mirage-protocol = { workspace = true  }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
