[package]
name = "mirage-wire-http-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP over the Mirage wire for a process that is not the operator."
repository = "https://github.com/knyaz-tishini/mirage-oss"
homepage = "https://github.com/knyaz-tishini/mirage-oss"
[lib]
name = "mirage_wire_http_client"

[dependencies]
mirage-core = { workspace = true  }
mirage-protocol = { workspace = true  }
tokio                = { workspace = true }
tracing              = { workspace = true }
hex                  = { workspace = true }
# Sender-proof header construction (`src/sender_proof.rs`) — the primitive
# moved here verbatim from the fleet's mesh-client crate so that this OSS
# layer carries no fleet dependency. Same MAC formula, same byte order.
x25519-dalek         = { workspace = true }
blake3               = { workspace = true }
base64               = { workspace = true }
serde_json           = { workspace = true }
zeroize              = { version = "1.8", features = ["alloc"] }

[dev-dependencies]
ed25519-dalek        = { workspace = true }
uuid                 = { workspace = true }
async-trait          = "0.1"
