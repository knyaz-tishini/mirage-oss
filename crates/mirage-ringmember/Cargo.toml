[package]
name = "mirage-ringmember"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = true
description = "Merkle ring-membership credential (scheme 0x04): keygen, Merkle tree, DLEQ nullifier, wire encode/decode"
repository = "https://github.com/knyaz-tishini/mirage-oss"
homepage = "https://github.com/knyaz-tishini/mirage-oss"
[dependencies]
# ristretto255 group operations; hash_from_bytes requires the digest feature
# (enabled by default in 4.x) and sha2 is pulled as a transitive dep
curve25519-dalek = { version = "4", features = ["digest", "rand_core"] }
sha2 = "0.10"
blake3 = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
thiserror = "1"

[dev-dependencies]
rand = "0.8"
