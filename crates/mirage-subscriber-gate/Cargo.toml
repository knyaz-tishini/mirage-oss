[package]
license = "MIT"
name = "mirage-subscriber-gate"
version = "0.1.1"
edition = "2021"
description = "Authenticate a customer dial and dispatch the tunnel."
repository = "https://github.com/knyaz-tishini/mirage-oss"
homepage = "https://github.com/knyaz-tishini/mirage-oss"
[dependencies]
mirage-core = { path = "../mirage-core", version = "0.1.1"  }
mirage-protocol = { path = "../mirage-protocol", version = "0.1.1"  }
arc-swap        = "1"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
tracing         = "0.1"
thiserror       = "2"
hex             = "0.4"
tokio           = { version = "1", features = ["full"] }
async-trait     = "0.1"
ed25519-dalek   = { version = "2", features = ["rand_core"] }

[dev-dependencies]
rand            = "0.8"
x25519-dalek    = { version = "2", features = ["static_secrets"] }
